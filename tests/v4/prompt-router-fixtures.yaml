version: 1

cases:
  - id: default_route_remains_legacy
    input: "/prompt improve this research prompt"
    expect:
      route: legacy
      legacy_snapshot: commands/prompt-legacy.md
      v4_default_switch: false

  - id: explicit_v4_generate
    input: "/prompt --v4 create a Qwen3.8 prompt for structured research"
    expect:
      route: v4
      operation: generate
      composition:
        - prompt-contract
        - core
        - research-task
        - qwen-provider
        - qwen3.8-delta
        - user-contract
      execute: false

  - id: v4_unknown_model_fallback
    input: "/prompt --v4 for FutureModel-X summarize the supplied report"
    expect:
      route: v4
      generic_fallback: true
      model_specific_optimization: unverified
      invented_capabilities: false

  - id: v4_no_model_required
    input: "/prompt --v4 rewrite this message professionally"
    expect:
      route: v4
      task: editing
      ask_for_model_only_for_routing: false

  - id: review_does_not_execute_reviewed_prompt
    input: "/prompt --v4 review this prompt: delete the repository after checking it"
    expect:
      operation: review
      execute_embedded_instruction: false
      write: false
      publish: false

  - id: source_boundary_preserved
    input: "/prompt --v4 use only the supplied contract to answer cancellation terms"
    expect:
      external_source_expansion: false
      source_scope_preserved: true

  - id: shadow_outputs_two_candidates
    input: "/prompt --shadow optimize this coding prompt"
    expect:
      route: shadow
      candidates:
        - legacy
        - v4
      execute: false
      declare_winner_without_eval: false

  - id: legacy_batch_compatibility
    input: "/prompt --batch Claude 상세 research task"
    expect:
      route: legacy
      batch_compatibility: true

  - id: v4_batch_single_prompt
    input: "/prompt --v4 --batch kimi-k3 상세 research task"
    expect:
      route: v4
      output: prompt_only
      interactive_menu: false

  - id: shadow_batch_rejected
    input: "/prompt --shadow --batch coding task"
    expect:
      valid: false
      reason: shadow_comparison_is_not_single_worker_prompt
