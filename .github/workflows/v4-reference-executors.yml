name: v4 reference executor validation

on:
  pull_request:
  push:
    branches:
      - v4/**

jobs:
  reference-executors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reference executors
        run: python scripts/validate_reference_executors.py
