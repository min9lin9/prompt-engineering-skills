name: v4 baseline guardrails

on:
  pull_request:
  push:
    branches:
      - "v4/**"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run v4 baseline guardrails
        run: python scripts/v4_baseline_guardrails.py

      - name: Verify baseline fixtures exist
        run: test -f tests/v4/baseline-fixtures.yaml
