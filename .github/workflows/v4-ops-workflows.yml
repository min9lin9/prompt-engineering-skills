name: v4 ops workflow validation

on:
  pull_request:
  push:
    branches:
      - "v4/**"

jobs:
  ops-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate operational command boundaries
        run: python scripts/validate_ops_workflows.py
