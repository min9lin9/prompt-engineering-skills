name: v4 release gate validation

on:
  pull_request:
  push:
    branches:
      - master
      - 'v4/**'

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate evidence-backed release gate
        run: python scripts/validate_release_gate.py
