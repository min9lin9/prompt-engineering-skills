name: v4 evaluation framework validation

on:
  pull_request:
  push:
    branches:
      - "v4/**"

jobs:
  eval-framework:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluation framework
        run: python scripts/validate_evals.py
