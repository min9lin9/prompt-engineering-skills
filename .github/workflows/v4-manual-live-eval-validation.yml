name: v4 manual live eval workflow validation

on:
  pull_request:
  push:
    branches:
      - 'v4/**'

jobs:
  validate-manual-live-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_manual_live_eval.py
